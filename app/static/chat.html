<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FrontDesk AI — Tester</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e8eaf0; --muted: #8b93a5; --accent: #5eead4; --user: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; justify-content: center; height: 100vh;
  }
  .wrap { width: min(720px, 100%); display: flex; flex-direction: column; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; padding: 4px 4px 14px; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 12.5px; }
  #newchat {
    margin-left: auto; background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 4px 12px; font-size: 12.5px; cursor: pointer;
  }
  #newchat:hover { border-color: var(--accent); color: var(--accent); }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .trace { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px; background: var(--panel);
  }
  .chip.ok::before { content: "✓ "; color: var(--accent); }
  .chip.fail::before { content: "✗ "; color: #f87171; }
  #inputrow { display: flex; gap: 8px; padding-top: 12px; }
  #input {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font: inherit; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #06281f; border: 0; border-radius: 10px;
    padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; padding-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>FrontDesk AI</h1><span id="cid">new conversation</span><button id="newchat">+ New</button></header>
  <div id="log"></div>
  <div id="inputrow">
    <input id="input" placeholder="Try: book a consultation tomorrow at 5pm…" autocomplete="off" />
    <button id="send">Send</button>
  </div>
  <div class="hint">Grok + PostgreSQL · tool calls shown as chips under each reply</div>
</div>
<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const cidLabel = document.getElementById("cid");
  let conversationId = null;

  function bubble(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function traceChips(traces) {
    if (!traces || !traces.length) return;
    const row = document.createElement("div");
    row.className = "trace";
    for (const t of traces) {
      const chip = document.createElement("span");
      chip.className = "chip " + (t.ok ? "ok" : "fail");
      chip.textContent = t.tool + ": " + t.summary;
      row.appendChild(chip);
    }
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    bubble("user", text);
    send.disabled = true;
    const waiting = bubble("bot", "…");
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, conversation_id: conversationId }),
      });
      const data = await res.json();
      waiting.remove();
      if (data.conversation_id) {
        conversationId = data.conversation_id;
        cidLabel.textContent = "conversation #" + conversationId;
      }
      traceChips(data.tool_trace);
      bubble("bot", data.reply || "(no reply)");
    } catch (e) {
      waiting.textContent = "Request failed: " + e;
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener("click", sendMsg);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
  document.getElementById("newchat").addEventListener("click", () => {
    conversationId = null;
    cidLabel.textContent = "new conversation";
    log.innerHTML = "";
    input.focus();
  });
  input.focus();
</script>
</body>
</html>
